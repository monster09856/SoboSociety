services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sobo
      POSTGRES_PASSWORD: sobo
      POSTGRES_DB: sobo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobo"]
      interval: 2s
      timeout: 3s
      retries: 15
