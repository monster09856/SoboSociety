workflows:
  ios-app-store:
    name: Sobo Society Flutter iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: android
    environment:
      flutter: 3.29.0
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        DEVELOPMENT_TEAM: "YR2KGFQ6H3"
    scripts:
      - name: Set up App Store Connect API Key & Profiles
        script: |
          set -e
          keychain initialize
          pip3 install --break-system-packages pyjwt requests cryptography || pip3 install pyjwt requests cryptography || true
          python3 setup_signing.py
          xcode-project use-profiles
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
      - name: Build Flutter iOS IPA
        script: |
          set -e
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
          flutter packages get
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=10 \
            --export-options-plist=ios/ExportOptions.plist
      - name: Publish IPA to App Store Connect TestFlight
        script: |
          set -e
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find . -name "*.ipa" 2>/dev/null | head -n 1)
          fi
          echo "Publishing IPA found at: $IPA_PATH"
          app-store-connect publish \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --path "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - android/build/ios/ipa/*.ipa
      - ios/build/ios/ipa/*.ipa
      - "*.ipa"



