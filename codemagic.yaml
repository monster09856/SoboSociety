workflows:
  ios-app-store:
    name: Sobo Society Flutter iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: android
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
    environment:
      flutter: 3.29.0
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        DEVELOPMENT_TEAM: "YR2KGFQ6H3"
        SHOREBIRD_TOKEN: "sb_api_TXmtC63S-oANCcJJfCydAso1jolGgyTFpHgsm7fTuCA"
    scripts:
      - name: Set up App Store Connect API Key & Profiles
        script: |
          set -e
          keychain initialize
          pip3 install --break-system-packages pyjwt requests cryptography || pip3 install pyjwt requests cryptography || true
          python3 setup_signing.py
          xcode-project use-profiles
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
      - name: Build Flutter iOS IPA (Shorebird Release)
        script: |
          set -e
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
          flutter packages get
          
          # Install Shorebird CLI
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash || true
          export PATH="$HOME/.shorebird/bin:$PATH"

          if command -v shorebird &> /dev/null && [ -n "$SHOREBIRD_TOKEN" ]; then
            echo "=== Building iOS IPA via Shorebird Release ==="
            yes | shorebird release ios \
              --build-name=1.0.4 \
              --build-number=15 \
              --export-options-plist=ios/ExportOptions.plist || {
                echo "Shorebird release encountered an issue, falling back to flutter build ipa..."
                flutter build ipa --release \
                  --build-name=1.0.4 \
                  --build-number=15 \
                  --export-options-plist=ios/ExportOptions.plist
              }
          else
            echo "=== Building standard Flutter iOS IPA ==="
            flutter build ipa --release \
              --build-name=1.0.4 \
              --build-number=15 \
              --export-options-plist=ios/ExportOptions.plist
          fi
      - name: Publish IPA to App Store Connect TestFlight
        script: |
          set -e
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find . -name "*.ipa" 2>/dev/null | head -n 1)
          fi
          echo "Publishing IPA found at: $IPA_PATH"
          app-store-connect publish \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --path "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - android/build/ios/ipa/*.ipa
      - ios/build/ios/ipa/*.ipa
      - "*.ipa"

  ios-shorebird-patch:
    name: Sobo Society iOS Shorebird Instant OTA Patch
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: android
    environment:
      flutter: 3.29.0
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        DEVELOPMENT_TEAM: "YR2KGFQ6H3"
        SHOREBIRD_TOKEN: "sb_api_TXmtC63S-oANCcJJfCydAso1jolGgyTFpHgsm7fTuCA"
    scripts:
      - name: Set up App Store Connect API Key & Profiles
        script: |
          set -e
          keychain initialize
          pip3 install --break-system-packages pyjwt requests cryptography || pip3 install pyjwt requests cryptography || true
          python3 setup_signing.py
          xcode-project use-profiles
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
      - name: Send Shorebird iOS Patch (Instant OTA)
        script: |
          set -e
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
          flutter packages get
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
          yes | shorebird patch ios --release-version=1.0.4+15 --export-options-plist=ios/ExportOptions.plist

