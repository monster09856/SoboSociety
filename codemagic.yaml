workflows:
  ios-app-store:
    name: Sobo Society iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up keychain + auto-signing via App Store Connect API
        script: |
          set -e
          keychain initialize
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "App Store Connect credentials present. Fetching signing files for $BUNDLE_ID..."
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "=========================================================================="
            echo "NOTICE: App Store Connect API key variables are missing in Codemagic UI!"
            echo "Please add APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,"
            echo "and APP_STORE_CONNECT_ISSUER_ID to the 'app_store_credentials' group in Codemagic."
            echo "=========================================================================="
          fi
      - name: Build Xcode Archive & IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project SoboSociety.xcodeproj \
            --scheme SoboSociety
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
