workflows:
  ios-app-store:
    name: Sobo Society iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
        DEVELOPMENT_TEAM: "YR2KGFQ6H3"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up App Store Connect API Key & Profiles
        script: |
          set -e
          keychain initialize
          pip3 install --break-system-packages pyjwt requests cryptography || pip3 install pyjwt requests cryptography || true
          python3 setup_signing.py
          xcode-project use-profiles
      - name: Build Xcode Archive & IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project SoboSociety.xcodeproj \
            --scheme SoboSociety
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
