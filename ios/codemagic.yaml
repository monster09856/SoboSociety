workflows:
  ios-app-store:
    name: Sobo Society iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
        DEVELOPMENT_TEAM: "YR2KGFQ6H3"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up App Store Connect API Key
        script: |
          set -e
          keychain initialize || true
          mkdir -p ~/.appstoreconnect/private_keys
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
            echo "App Store Connect API Key saved successfully."
          fi
      - name: Build Xcode Archive & IPA
        script: |
          set -e
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          mkdir -p build/ios/ipa build/ios/xcarchive

          echo "Archiving Xcode project for Apple Distribution with App Store Connect API..."
          xcodebuild -project SoboSociety.xcodeproj \
            -scheme SoboSociety \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "$KEY_PATH" \
            DEVELOPMENT_TEAM="YR2KGFQ6H3" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution"

          echo "Exporting IPA package for App Store distribution..."
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "$KEY_PATH"

          cp build/ios/ipa/*.ipa . || true
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
