workflows:
  ios-app-store:
    name: Sobo Society iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up App Store Connect API Key & Profiles
        script: |
          set -e
          keychain initialize || true
          mkdir -p ~/.appstoreconnect/private_keys
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
            echo "App Store Connect API Key saved."
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
            keychain add-certificates || true
            xcode-project use-profiles || true
          fi
      - name: Build Xcode Archive & IPA
        script: |
          set -e
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          mkdir -p build/ios/ipa build/ios/xcarchive

          # Auto-detect Team ID from fetched Provisioning Profile if not set in env
          DETECTED_TEAM_ID=$(grep -A1 "TeamIdentifier" ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | grep "<string>" | sed -e 's/<[^>]*>//g' | tr -d ' \t\r\n' | head -n 1 || true)
          TARGET_TEAM_ID="${DEVELOPMENT_TEAM:-$DETECTED_TEAM_ID}"

          echo "Detected Team ID: '$TARGET_TEAM_ID'"

          if [ -f "$KEY_PATH" ]; then
            echo "Building Xcode project with automatic code signing and team parameters..."
            xcodebuild -project SoboSociety.xcodeproj \
              -scheme SoboSociety \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
              archive \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              -authenticationKeyPath "$KEY_PATH" \
              ${TARGET_TEAM_ID:+DEVELOPMENT_TEAM=$TARGET_TEAM_ID} \
              CODE_SIGN_STYLE=Automatic

            echo "Exporting IPA package for App Store distribution..."
            xcodebuild -exportArchive \
              -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
              -exportOptionsPlist export_options.plist \
              -exportPath build/ios/ipa \
              -allowProvisioningUpdates \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              -authenticationKeyPath "$KEY_PATH"

            cp build/ios/ipa/*.ipa . || true
          else
            xcode-project build-ipa \
              --project SoboSociety.xcodeproj \
              --scheme SoboSociety
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
