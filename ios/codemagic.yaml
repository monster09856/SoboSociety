workflows:
  ios-app-store:
    name: Sobo Society iOS TestFlight & App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up keychain + auto-signing via App Store Connect API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true
      - name: Build Xcode Archive & IPA
        script: |
          mkdir -p build/ios/ipa build/ios/xcarchive
          xcodebuild -project SoboSociety.xcodeproj \
            -scheme SoboSociety \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
            archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/SoboSociety.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath build/ios/ipa

          cp build/ios/ipa/*.ipa . || true
    artifacts:
      - build/**/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
