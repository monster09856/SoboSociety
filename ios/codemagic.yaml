workflows:
  ios-app-store:
    name: Sobo Society iOS App Store & TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sobosociety.app"
        XCODE_SCHEME: "SoboSociety"
    scripts:
      - name: Set up keychain + auto-signing via ASC API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build Xcode Archive & IPA
        script: |
          xcode-project build-ipa \
            --project SoboSociety.xcodeproj \
            --scheme SoboSociety
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
